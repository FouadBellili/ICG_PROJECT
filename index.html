<!DOCTYPE html>
<html lang="en">
<!--
    Frozen Frontier: An Alien Ice World Explorer
    Introduction to Computer Graphics - 2025/2026
    AI tools used: Anthropic. (2026). Claude [Large language model]. https://claude.ai
-->

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frozen Frontier</title>
    <link rel="stylesheet" href="style.css">

    <script type="importmap">
        {
          "imports": {
            "three": "https://threejs.org/build/three.module.js",
            "three/addons/": "https://threejs.org/examples/jsm/"
          }
        }
    </script>

    <script type="module">

        import * as THREE from "three";
        import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

        // ─────────────────────────────────────────────
        // CONFIG
        // ─────────────────────────────────────────────
        const CHUNK_SIZE     = 50;
        const CHUNK_SEGS     = 40;
        const VIEW_RANGE     = 3;
        const EYE_HEIGHT     = 2.0;
        const MOVE_SPEED     = 0.12;
        const PLAYER_RADIUS  = 0.55;
        const GRAVITY        = -0.016;
        const JUMP_FORCE     = 0.21;
        const SENSITIVITY    = 0.65;   // PointerLockControls pointerSpeed

        // ─────────────────────────────────────────────
        // STATE
        // ─────────────────────────────────────────────
        const sceneElements  = { sceneGraph:null, camera:null, controls:null, renderer:null };
        const chunkMap       = new Map();
        const chunkColliders = new Map();
        const artefacts      = [];
        let   terrainMat, overlayMat, rockMat, spireMat;

        let keyW=false, keyS=false, keyA=false, keyD=false;
        let walkPhase    = 0;
        let prevStepCycle = 0;
        let velocityY    = 0;
        let isOnGround   = true;
        let currentLore  = -1;
        const discovered = new Set();   // indices of found artefacts

        // Wind — slowly shifting direction, drives snow drift
        const wind = { x: 0, z: 0 };
        function updateWind(t) {
            wind.x = Math.sin(t*0.07)*0.020 + Math.sin(t*0.19)*0.009;
            wind.z = Math.cos(t*0.05)*0.016 + Math.cos(t*0.13)*0.007;
        }

        // ─────────────────────────────────────────────
        // AUDIO  (Web Audio API — no external libs)
        // ─────────────────────────────────────────────
        let audioCtx     = null;
        let footstepBuf  = null;

        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                // Shared white noise buffer (3 s, looped for ambient, also used for steps)
                const SR = audioCtx.sampleRate;
                const noiseBuf = audioCtx.createBuffer(1, SR * 3, SR);
                const nd = noiseBuf.getChannelData(0);
                for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

                // ── Ambient wind ──────────────────────
                const windSrc = audioCtx.createBufferSource();
                windSrc.buffer = noiseBuf; windSrc.loop = true;

                const wf1 = audioCtx.createBiquadFilter();
                wf1.type = 'bandpass'; wf1.frequency.value = 220; wf1.Q.value = 0.5;
                const wf2 = audioCtx.createBiquadFilter();
                wf2.type = 'lowpass'; wf2.frequency.value = 700;

                const windGain = audioCtx.createGain(); windGain.gain.value = 0.10;
                // Slow wind swell (0.06 Hz)
                const windLFO = audioCtx.createOscillator(); windLFO.frequency.value = 0.06;
                const windLFOGain = audioCtx.createGain(); windLFOGain.gain.value = 0.05;
                windLFO.connect(windLFOGain); windLFOGain.connect(windGain.gain); windLFO.start();

                windSrc.connect(wf1); wf1.connect(wf2); wf2.connect(windGain); windGain.connect(audioCtx.destination);
                windSrc.start();

                // ── Breathing ─────────────────────────
                const breathSrc = audioCtx.createBufferSource();
                breathSrc.buffer = noiseBuf; breathSrc.loop = true;

                const bf = audioCtx.createBiquadFilter();
                bf.type = 'bandpass'; bf.frequency.value = 160; bf.Q.value = 5;

                const breathGain = audioCtx.createGain(); breathGain.gain.value = 0.0;
                // Breathing rhythm ~0.22 Hz (≈13 breaths/min)
                const breathLFO = audioCtx.createOscillator(); breathLFO.frequency.value = 0.22;
                const breathLFOGain = audioCtx.createGain(); breathLFOGain.gain.value = 0.055;
                breathLFO.connect(breathLFOGain); breathLFOGain.connect(breathGain.gain); breathLFO.start();

                breathSrc.connect(bf); bf.connect(breathGain); breathGain.connect(audioCtx.destination);
                breathSrc.start();

                // ── Footstep buffer (short noise burst) ─
                footstepBuf = audioCtx.createBuffer(1, Math.floor(SR * 0.1), SR);
                const fd = footstepBuf.getChannelData(0);
                for (let i = 0; i < fd.length; i++) fd[i] = Math.random() * 2 - 1;

            } catch(e) {
                console.warn('Audio unavailable:', e);
            }
        }

        function playFootstep() {
            if (!audioCtx || audioCtx.state !== 'running' || !footstepBuf) return;
            const now = audioCtx.currentTime;
            const src = audioCtx.createBufferSource(); src.buffer = footstepBuf;
            const filt = audioCtx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 450;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.20, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            src.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
            src.start(now); src.stop(now + 0.15);
        }

        function playDiscoverySound() {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;
            // Ascending ethereal chord
            [220, 330, 528, 660, 880].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                osc.type = 'sine'; osc.frequency.value = freq;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0,    now + i*0.07);
                gain.gain.linearRampToValueAtTime(0.12, now + i*0.07 + 0.06);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.07 + 0.55);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now + i*0.07); osc.stop(now + i*0.07 + 0.6);
            });
        }

        function playLandSound() {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            osc.type = 'sine'; osc.frequency.setValueAtTime(55, now);
            osc.frequency.exponentialRampToValueAtTime(25, now + 0.18);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.2);
        }

        // ─────────────────────────────────────────────
        // SEEDED PRNG  (mulberry32)
        // ─────────────────────────────────────────────
        function mulberry32(seed) {
            let a = (seed >>> 0);
            return () => {
                a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }
        function chunkSeed(cx, cz) { return (((cx * 73856093) ^ (cz * 19349663)) >>> 0); }

        // ─────────────────────────────────────────────
        // NOISE
        // ─────────────────────────────────────────────
        function noise(x, z) {
            const ix=Math.floor(x), iz=Math.floor(z);
            const fx=x-ix, fz=z-iz;
            const ux=fx*fx*(3-2*fx), uz=fz*fz*(3-2*fz);
            const r=(a,b)=>{ const n=Math.sin(a*127.1+b*311.7)*43758.5453123; return n-Math.floor(n); };
            return (r(ix,iz)*(1-ux)*(1-uz)+r(ix+1,iz)*ux*(1-uz)+r(ix,iz+1)*(1-ux)*uz+r(ix+1,iz+1)*ux*uz)*2-1;
        }

        function worldHeight(wx, wz) {
            return noise(wx*0.04,wz*0.04)*3.5 + noise(wx*0.12,wz*0.12)*1.2
                 + noise(wx*0.35,wz*0.35)*0.4  + noise(wx*0.9, wz*0.9 )*0.12;
        }

        // ─────────────────────────────────────────────
        // TEXTURE GENERATORS
        // ─────────────────────────────────────────────
        function makeTexture(S, aniso, repeatN, pixelFn) {
            const cv = document.createElement('canvas'); cv.width = cv.height = S;
            const ctx = cv.getContext('2d'), img = ctx.createImageData(S, S);
            for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
                const [r,g,b,a] = pixelFn(x/S, y/S);
                const i=(y*S+x)*4; img.data[i]=r; img.data[i+1]=g; img.data[i+2]=b; img.data[i+3]=a;
            }
            ctx.putImageData(img, 0, 0);
            const t = new THREE.CanvasTexture(cv);
            t.anisotropy = aniso; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeatN, repeatN);
            return t;
        }

        // Ice terrain roughness (smooth undulating pattern)
        function makeIceRoughness(aniso) {
            return makeTexture(512, aniso, 8, (u,v) => {
                const x=u*10, z=v*10;
                const val = noise(x,z)*0.5 + noise(x*2.3,z*2.3)*0.3 + noise(x*5.1,z*5.1)*0.15 + noise(x*11,z*11)*0.05;
                const b = Math.floor((0.22 + (val*0.5+0.5)*0.65)*255);
                return [b,b,b,255];
            });
        }

        // Ice terrain normal map
        function makeIceNormal(aniso) {
            return makeTexture(512, aniso, 8, (u,v) => {
                const x=u*14, z=v*14;
                const s=(sx,sz) => noise(sx,sz)*0.5+noise(sx*2.5,sz*2.5)*0.3+noise(sx*6,sz*6)*0.15+noise(sx*14,sz*14)*0.05;
                const h=s(x,z), hR=s(x+0.07,z), hU=s(x,z+0.07);
                return [Math.floor(((hR-h)*3*0.5+0.5)*255), Math.floor(((hU-h)*3*0.5+0.5)*255), 200, 255];
            });
        }

        // Rock roughness (grainy, high-frequency)
        function makeRockRoughness(aniso) {
            return makeTexture(512, aniso, 3, (u,v) => {
                const x=u*22, z=v*22;
                const val = noise(x,z)*0.35+noise(x*3.1,z*3.1)*0.3+noise(x*7.5,z*7.5)*0.22+noise(x*18,z*18)*0.13;
                const b = Math.floor((0.45 + (val*0.5+0.5)*0.45)*255);
                return [b,b,b,255];
            });
        }

        // Soft circular snowflake sprite (radial gradient → transparent edge)
        function makeSnowflakeTexture() {
            const S = 64, cv = document.createElement('canvas'); cv.width = cv.height = S;
            const ctx = cv.getContext('2d');
            const g = ctx.createRadialGradient(S/2,S/2,0, S/2,S/2,S/2);
            g.addColorStop(0,    'rgba(255,255,255,1.0)');
            g.addColorStop(0.25, 'rgba(230,245,255,0.95)');
            g.addColorStop(0.55, 'rgba(200,230,255,0.5)');
            g.addColorStop(1.0,  'rgba(180,215,255,0.0)');
            ctx.fillStyle = g; ctx.fillRect(0,0,S,S);
            return new THREE.CanvasTexture(cv);
        }

        // Creates a smooth, organically deformed rock geometry.
        // Uses world position (px, pz) as a per-rock noise offset so each
        // rock is uniquely shaped without consuming the seeded RNG.
        function createRockGeo(size, px, pz) {
            const geo = new THREE.IcosahedronGeometry(size, 2); // 162 verts — smooth silhouette
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const lx = pos.getX(i), ly = pos.getY(i), lz = pos.getZ(i);
                // Offset noise coords by world pos so every rock is unique
                const nx = lx + px * 0.43, ny = ly + pz * 0.37, nz = lz + (px - pz) * 0.29;
                const d = 1.0
                    + noise(nx * 1.8, nz * 1.8) * 0.20   // coarse lumps
                    + noise(ny * 4.3, nz * 4.3) * 0.09   // medium bumps
                    + noise(nx * 9.8, ny * 9.8) * 0.03;  // fine surface variation
                pos.setXYZ(i, lx * d, ly * d, lz * d);
            }
            geo.computeVertexNormals();
            return geo;
        }

        // Rock normal map (sharp, fractured surface detail)
        function makeRockNormal(aniso) {
            return makeTexture(512, aniso, 3, (u,v) => {
                const x=u*22, z=v*22;
                const s=(sx,sz) => noise(sx,sz)*0.35+noise(sx*3.1,sz*3.1)*0.3+noise(sx*7.5,sz*7.5)*0.22+noise(sx*18,sz*18)*0.13;
                const h=s(x,z), hR=s(x+0.04,z), hU=s(x,z+0.04);
                return [Math.floor(((hR-h)*6*0.5+0.5)*255), Math.floor(((hU-h)*6*0.5+0.5)*255), 190, 255];
            });
        }

        // ─────────────────────────────────────────────
        // SCENE INIT
        // ─────────────────────────────────────────────
        function initScene() {
            const sg = new THREE.Scene();
            sg.fog = new THREE.FogExp2(0x050c1a, 0.022);
            sceneElements.sceneGraph = sg;

            const W=window.innerWidth, H=window.innerHeight;
            const camera = new THREE.PerspectiveCamera(75, W/H, 0.1, 500);
            camera.position.set(0, worldHeight(0,0)+EYE_HEIGHT, 0);
            sceneElements.camera = camera;

            sg.add(new THREE.AmbientLight(0x060e28, 1.0));

            const sun = new THREE.DirectionalLight(0xc0dcff, 2.0);
            sun.castShadow = true;
            sun.shadow.mapSize.width = sun.shadow.mapSize.height = 2048;
            sun.shadow.camera.near=0.5; sun.shadow.camera.far=150;
            sun.shadow.camera.left=-60; sun.shadow.camera.right=60;
            sun.shadow.camera.top=60;   sun.shadow.camera.bottom=-60;
            sun.shadow.bias=-0.001; sun.name="sun"; sg.add(sun); sg.add(sun.target);

            const fill = new THREE.DirectionalLight(0x1a3a99, 0.55);
            fill.position.set(40,10,20); sg.add(fill);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x020810, 1.0);
            renderer.setSize(W, H);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
            renderer.toneMapping       = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            sceneElements.renderer = renderer;
            document.querySelector("#Tag3DScene").appendChild(renderer.domElement);

            const controls = new PointerLockControls(camera, renderer.domElement);
            controls.pointerSpeed = SENSITIVITY;
            sceneElements.controls = controls;

            const overlay   = document.getElementById('overlay');
            const hud       = document.getElementById('hud');
            const crosshair = document.getElementById('crosshair');
            const lorePanel = document.getElementById('lore-panel');

            overlay.addEventListener('click', () => {
                controls.lock();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            });
            const counter = document.getElementById('anomaly-counter');
            controls.addEventListener('lock',   () => { overlay.style.display='none'; hud.style.display='flex'; crosshair.style.display='block'; counter.style.display='block'; });
            controls.addEventListener('unlock', () => { overlay.style.display='flex'; hud.style.display='none'; crosshair.style.display='none'; counter.style.display='none'; lorePanel.style.opacity='0'; });
        }

        // ─────────────────────────────────────────────
        // SHARED MATERIALS
        // ─────────────────────────────────────────────
        function initMaterials() {
            const aniso = sceneElements.renderer.capabilities.getMaxAnisotropy();
            const iceRough = makeIceRoughness(aniso);
            const iceNorm  = makeIceNormal(aniso);
            const rockRough = makeRockRoughness(aniso);
            const rockNorm  = makeRockNormal(aniso);

            terrainMat = new THREE.MeshStandardMaterial({
                color: 0xdcefff, roughness: 0.48, metalness: 0.22,
                roughnessMap: iceRough, normalMap: iceNorm,
                normalScale: new THREE.Vector2(0.45, 0.45),
            });
            overlayMat = new THREE.MeshStandardMaterial({
                color: 0x99ddff, roughness: 0.04, metalness: 0.70,
                transparent: true, opacity: 0.28,
            });
            rockMat = new THREE.MeshStandardMaterial({
                color: 0x2e3c48, roughness: 0.92, metalness: 0.04,
                roughnessMap: rockRough, normalMap: rockNorm,
                normalScale: new THREE.Vector2(1.4, 1.4),
            });
            spireMat = new THREE.MeshStandardMaterial({
                color: 0x9be8ff, roughness: 0.05, metalness: 0.38,
                transparent: true, opacity: 0.83,
                roughnessMap: iceRough, normalMap: iceNorm,
                normalScale: new THREE.Vector2(0.3, 0.3),
            });
        }

        // ─────────────────────────────────────────────
        // INFINITE CHUNK TERRAIN
        // ─────────────────────────────────────────────
        function buildChunk(cx, cz) {
            const rand = mulberry32(chunkSeed(cx, cz));
            const grp  = new THREE.Group();
            const cols  = [];

            // Terrain mesh (PlaneGeometry rotated -π/2: world.x=lx+cx·CS, world.z=-ly+cz·CS)
            const geo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, CHUNK_SEGS, CHUNK_SEGS);
            const p = geo.attributes.position;
            for (let i = 0; i < p.count; i++) {
                const wx = p.getX(i) + cx * CHUNK_SIZE;
                const wz = -p.getY(i) + cz * CHUNK_SIZE;
                p.setZ(i, worldHeight(wx, wz));
            }
            geo.computeVertexNormals();

            const terrain = new THREE.Mesh(geo, terrainMat);
            terrain.rotation.x = -Math.PI / 2;
            terrain.position.set(cx * CHUNK_SIZE, 0, cz * CHUNK_SIZE);
            terrain.receiveShadow = true;
            grp.add(terrain);

            const ice = new THREE.Mesh(geo.clone(), overlayMat);
            ice.rotation.x = -Math.PI / 2;
            ice.position.set(cx * CHUNK_SIZE, 0.02, cz * CHUNK_SIZE);
            grp.add(ice);

            // Rock clusters (1–3 per chunk)
            const numClusters = 1 + Math.floor(rand() * 3);
            for (let c = 0; c < numClusters; c++) {
                const clx = (rand()-0.5)*CHUNK_SIZE*0.9 + cx*CHUNK_SIZE;
                const clz = (rand()-0.5)*CHUNK_SIZE*0.9 + cz*CHUNK_SIZE;
                const numRocks = 1 + Math.floor(rand() * 4);
                for (let r = 0; r < numRocks; r++) {
                    const px = clx+(rand()-0.5)*6, pz = clz+(rand()-0.5)*6;
                    const size = 0.4+rand()*1.8;
                    const sx=0.55+rand()*0.9, sy=0.4+rand()*0.8, sz=0.55+rand()*0.9;
                    const mesh = new THREE.Mesh(createRockGeo(size, px, pz), rockMat);
                    mesh.scale.set(sx,sy,sz);
                    mesh.position.set(px, worldHeight(px,pz)+size*sy*0.18, pz);
                    mesh.rotation.set(rand()*Math.PI, rand()*Math.PI*2, rand()*Math.PI);
                    mesh.castShadow=mesh.receiveShadow=true; grp.add(mesh);
                    cols.push({ x:px, z:pz, radius: size*Math.max(sx,sz)*0.85 });
                }
            }

            // Ice spire cluster (~35% chance)
            if (rand() < 0.35) {
                const clx=(rand()-0.5)*CHUNK_SIZE*0.8+cx*CHUNK_SIZE;
                const clz=(rand()-0.5)*CHUNK_SIZE*0.8+cz*CHUNK_SIZE;
                const numSpires=3+Math.floor(rand()*7);
                for (let s=0;s<numSpires;s++) {
                    const px=clx+(rand()-0.5)*9, pz=clz+(rand()-0.5)*9;
                    const h=1.5+rand()*8, br=0.08+rand()*0.42;
                    const mesh=new THREE.Mesh(new THREE.ConeGeometry(br,h,5+Math.floor(rand()*4)),spireMat);
                    mesh.position.set(px, worldHeight(px,pz)+h*0.5, pz);
                    mesh.rotation.y=rand()*Math.PI*2; mesh.rotation.z=(rand()-0.5)*0.22;
                    mesh.castShadow=mesh.receiveShadow=true; grp.add(mesh);
                    cols.push({ x:px, z:pz, radius: br*2.5+0.4 });
                }
            }

            return { group:grp, cols };
        }

        function updateChunks() {
            const sg=sceneElements.sceneGraph, cam=sceneElements.camera;
            const pcx=Math.round(cam.position.x/CHUNK_SIZE), pcz=Math.round(cam.position.z/CHUNK_SIZE);
            const needed=new Set();
            for (let dx=-VIEW_RANGE;dx<=VIEW_RANGE;dx++) for (let dz=-VIEW_RANGE;dz<=VIEW_RANGE;dz++) {
                const cx=pcx+dx, cz=pcz+dz, key=`${cx},${cz}`;
                needed.add(key);
                if (!chunkMap.has(key)) {
                    const {group,cols}=buildChunk(cx,cz);
                    sg.add(group); chunkMap.set(key,group); chunkColliders.set(key,cols);
                }
            }
            for (const [key,group] of chunkMap) if (!needed.has(key)) {
                sceneElements.sceneGraph.remove(group);
                group.traverse(c=>{ if(c.isMesh) c.geometry.dispose(); });
                chunkMap.delete(key); chunkColliders.delete(key);
            }
        }

        function resolveCollisions() {
            const cam=sceneElements.camera;
            for (const [,cols] of chunkColliders) for (const c of cols) {
                const dx=cam.position.x-c.x, dz=cam.position.z-c.z;
                const d2=dx*dx+dz*dz, minD=PLAYER_RADIUS+c.radius;
                if (d2<minD*minD && d2>0.0001) {
                    const d=Math.sqrt(d2), push=(minD-d)/d;
                    cam.position.x+=dx*push; cam.position.z+=dz*push;
                }
            }
        }

        // ─────────────────────────────────────────────
        // FIXED OBJECTS
        // ─────────────────────────────────────────────
        function buildFixedObjects(sg) {
            createStarField(sg);
            createArtefacts(sg);
            createSnowLayers(sg);
            createPlanetDisc(sg);
        }

        function createStarField(sg) {
            const N=6000, pos=new Float32Array(N*3);
            for (let i=0;i<N;i++) {
                const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=300+Math.random()*100;
                pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
            }
            const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
            const s=new THREE.Points(geo,new THREE.PointsMaterial({color:0xffffff,size:0.5,sizeAttenuation:true,transparent:true,opacity:0.85}));
            s.name="starField"; sg.add(s);
        }

        function createArtefacts(sg) {
            const loreList = [
                "Stasis signal detected. Duration: unknown. Origin: unknown.",
                "Ice sample: non-terrestrial crystalline lattice. Growth direction: inward.",
                "Magnetic anchor point. Something beneath the surface is listening.",
                "Thermal bloom — 40°K above baseline. The cold here breathes.",
                "Repeating pulse, 7.3 seconds. Not a machine. Not a lifeform. Something else.",
            ];
            // One artefact per angular sector, random radius 28–80, so they
            // spread across the whole map rather than clustering near spawn
            const spots = Array.from({length:5}, (_,i) => {
                const angle = (i/5)*Math.PI*2 + (Math.random()-0.5)*0.9;
                const r     = 28 + Math.random()*52;
                return [Math.cos(angle)*r, Math.sin(angle)*r];
            });
            const colors = [0x00ffcc, 0xff44aa, 0xaaff00, 0x4499ff, 0xff8800];
            spots.forEach(([ax,az],idx) => {
                const th=worldHeight(ax,az), h=1.2+Math.random()*1.5, color=colors[idx];
                const mat=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:0.6,roughness:0.1,metalness:0.5,transparent:true,opacity:0.85});
                const crystal=new THREE.Mesh(new THREE.OctahedronGeometry(0.45+Math.random()*0.35,0),mat);
                crystal.scale.y=h; crystal.position.set(ax,th+h*0.5+0.5,az); crystal.castShadow=true; crystal.name=`artefact_${idx}`; sg.add(crystal);
                const light=new THREE.PointLight(color,1.5,18); light.position.set(ax,th+h+1,az); light.name=`artefactLight_${idx}`; sg.add(light);
                artefacts.push({position:new THREE.Vector3(ax,th+h*0.5,az),lore:loreList[idx],meshName:`artefact_${idx}`,lightName:`artefactLight_${idx}`});
            });
        }

        // Three snow layers: distant veil, main fall, close large flakes
        function createSnowLayers(sg) {
            const flakeTex = makeSnowflakeTexture();
            const layers = [
                { name:'snow_veil',  N:3500, size:0.055, opacity:0.30, spread:130, height:38, spdMult:0.7 },
                { name:'snow_mid',   N:1800, size:0.18,  opacity:0.55, spread: 95, height:30, spdMult:1.0 },
                { name:'snow_close', N: 450, size:0.50,  opacity:0.80, spread: 55, height:22, spdMult:1.4 },
            ];
            layers.forEach(layer => {
                const N=layer.N;
                const pos=new Float32Array(N*3), vel=new Float32Array(N), ph=new Float32Array(N);
                for (let i=0;i<N;i++) {
                    pos[i*3]  =(Math.random()-0.5)*layer.spread;
                    pos[i*3+1]= Math.random()*layer.height;
                    pos[i*3+2]=(Math.random()-0.5)*layer.spread;
                    vel[i]=(0.012+Math.random()*0.03)*layer.spdMult;
                    ph[i] =Math.random()*Math.PI*2;
                }
                const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
                const mat=new THREE.PointsMaterial({
                    map:flakeTex, size:layer.size, transparent:true, opacity:layer.opacity,
                    sizeAttenuation:true, alphaTest:0.01, depthWrite:false,
                    color:0xddeeff,
                });
                const pts=new THREE.Points(geo,mat);
                pts.name=layer.name;
                pts.userData={ vel, ph, spread:layer.spread, height:layer.height };
                sg.add(pts);
            });
        }

        function createPlanetDisc(sg) {
            const p=new THREE.Mesh(new THREE.CircleGeometry(12,64),new THREE.MeshBasicMaterial({color:0x1a3a6e,transparent:true,opacity:0.55,side:THREE.DoubleSide}));
            p.position.set(-80,60,-150); sg.add(p);
            const h=new THREE.Mesh(new THREE.CircleGeometry(16,64),new THREE.MeshBasicMaterial({color:0x0033aa,transparent:true,opacity:0.18,side:THREE.DoubleSide}));
            h.position.set(-80,60,-150.5); sg.add(h);
        }

        // ─────────────────────────────────────────────
        // DISCOVERY UI HELPERS
        // ─────────────────────────────────────────────
        function updateCounter() {
            const n = discovered.size;
            const el = document.getElementById('anomaly-counter');
            if (!el) return;
            el.innerHTML = `<span class="cnt-num">${n}</span><span class="cnt-sep"> / 5</span><span class="cnt-label"> ANOMALIES</span>`;
            if (n === 5) {
                el.classList.add('complete');
                document.getElementById('discovery-msg').textContent = 'ALL ANOMALIES DETECTED';
                document.getElementById('discovery-msg').style.opacity = '1';
            }
        }

        let discoveryTimer = null;
        function showDiscoveryFlash(idx) {
            const msg = document.getElementById('discovery-msg');
            if (!msg) return;
            if (discoveryTimer) clearTimeout(discoveryTimer);
            msg.textContent = `ANOMALY ${idx + 1} DETECTED`;
            msg.style.opacity = '1';
            if (discovered.size < 5) {
                discoveryTimer = setTimeout(() => { msg.style.opacity = '0'; }, 2500);
            }
        }

        // ─────────────────────────────────────────────
        // ANIMATION LOOP
        // ─────────────────────────────────────────────
        function computeFrame(time) {
            const t=time*0.001;
            const sg=sceneElements.sceneGraph, cam=sceneElements.camera, controls=sceneElements.controls;

            updateChunks();

            // Sun tracks player for localised shadows
            const sun=sg.getObjectByName("sun");
            if (sun) {
                sun.position.set(cam.position.x-60,40,cam.position.z-30);
                sun.target.position.set(cam.position.x,0,cam.position.z);
                sun.target.updateMatrixWorld();
                sun.intensity=2.5+Math.sin(t*0.3)*0.15;
            }

            const stars=sg.getObjectByName("starField");
            if (stars) stars.rotation.y=t*0.005;

            // ── Movement + physics ───────────────────
            const moving = controls.isLocked && (keyW||keyS||keyA||keyD);
            if (controls.isLocked) {
                if (keyW) controls.moveForward( MOVE_SPEED);
                if (keyS) controls.moveForward(-MOVE_SPEED);
                if (keyD) controls.moveRight(   MOVE_SPEED);
                if (keyA) controls.moveRight(  -MOVE_SPEED);

                resolveCollisions();

                // Gravity + jump
                const floorY = worldHeight(cam.position.x, cam.position.z) + EYE_HEIGHT;
                velocityY += GRAVITY;
                cam.position.y += velocityY;

                if (cam.position.y <= floorY) {
                    if (velocityY < -0.08) playLandSound();
                    cam.position.y = floorY;
                    velocityY = 0;
                    isOnGround = true;
                } else {
                    isOnGround = false;
                }

                // Head bob when walking on ground
                if (moving && isOnGround) {
                    walkPhase += 0.085;
                    const cycle = Math.floor(walkPhase / Math.PI);
                    if (cycle > prevStepCycle) { playFootstep(); prevStepCycle = cycle; }
                    cam.position.y += Math.abs(Math.sin(walkPhase)) * 0.065;
                }
            }

            // ── Wind + snow layers follow camera ─────
            updateWind(t);
            ['snow_veil','snow_mid','snow_close'].forEach(name => {
                const layer=sg.getObjectByName(name); if (!layer) return;
                layer.position.set(cam.position.x,0,cam.position.z);
                const pa=layer.geometry.attributes.position;
                const {vel,ph,spread,height}=layer.userData;
                for (let i=0;i<pa.count;i++) {
                    let y=pa.getY(i)-vel[i];
                    if (y<-2) {
                        y=height+Math.random()*5;
                        pa.setX(i,(Math.random()-0.5)*spread);
                        pa.setZ(i,(Math.random()-0.5)*spread);
                    }
                    // Wind + gentle flutter per-flake
                    pa.setX(i, pa.getX(i)+wind.x+Math.sin(t*0.35+ph[i])*0.003);
                    pa.setZ(i, pa.getZ(i)+wind.z+Math.cos(t*0.28+ph[i])*0.003);
                    pa.setY(i, y);
                }
                pa.needsUpdate=true;
            });

            // ── Artefact pulse ───────────────────────
            artefacts.forEach((art,idx) => {
                const pulse=0.5+0.5*Math.sin(t*1.8+idx*1.3);
                const mesh=sg.getObjectByName(art.meshName), light=sg.getObjectByName(art.lightName);
                if (mesh)  { mesh.material.emissiveIntensity=0.4+pulse*0.7; mesh.rotation.y=t*0.5+idx; }
                if (light)   light.intensity=1.0+pulse*1.5;
            });

            // ── Proximity: lore display + discovery ──
            if (controls.isLocked) {
                const lorePanel = document.getElementById('lore-panel');
                let nearest=-1, nearDist=Infinity;
                artefacts.forEach((art,idx) => {
                    const d = cam.position.distanceTo(art.position);
                    if (d<12 && d<nearDist) { nearDist=d; nearest=idx; }

                    // Discovery triggers on first approach within 8 units
                    if (d<8 && !discovered.has(idx)) {
                        discovered.add(idx);
                        updateCounter();
                        showDiscoveryFlash(idx);
                        playDiscoverySound();
                    }
                });
                if (nearest!==currentLore) {
                    currentLore=nearest;
                    if (nearest>=0) { lorePanel.textContent=artefacts[nearest].lore; lorePanel.style.opacity='1'; }
                    else            { lorePanel.style.opacity='0'; }
                }
            }

            sceneElements.renderer.render(sg, cam);
            requestAnimationFrame(computeFrame);
        }

        // ─────────────────────────────────────────────
        // EVENT HANDLERS
        // ─────────────────────────────────────────────
        window.addEventListener('resize', () => {
            const W=window.innerWidth, H=window.innerHeight;
            sceneElements.camera.aspect=W/H; sceneElements.camera.updateProjectionMatrix();
            sceneElements.renderer.setSize(W,H);
        });

        document.addEventListener('keydown', e => {
            switch(e.code) {
                case 'KeyW': keyW=true; break; case 'KeyS': keyS=true; break;
                case 'KeyA': keyA=true; break; case 'KeyD': keyD=true; break;
                case 'Space':
                    e.preventDefault();
                    if (isOnGround && sceneElements.controls.isLocked) {
                        velocityY = JUMP_FORCE; isOnGround = false;
                    }
                    break;
            }
        });
        document.addEventListener('keyup', e => {
            switch(e.code) {
                case 'KeyW': keyW=false; break; case 'KeyS': keyS=false; break;
                case 'KeyA': keyA=false; break; case 'KeyD': keyD=false; break;
            }
        });

        // ─────────────────────────────────────────────
        // START
        // ─────────────────────────────────────────────
        initAudio();
        initScene();
        initMaterials();
        buildFixedObjects(sceneElements.sceneGraph);
        requestAnimationFrame(computeFrame);

    </script>
</head>

<body>
    <div id="Tag3DScene"></div>

    <div id="overlay">
        <div id="overlay-inner">
            <div id="overlay-title">&#10052; FROZEN FRONTIER</div>
            <div id="overlay-subtitle">An Alien Ice World</div>
            <div id="overlay-click">CLICK TO ENTER</div>
            <div id="overlay-hint">WASD · Move &nbsp;|&nbsp; Mouse · Look &nbsp;|&nbsp; Space · Jump &nbsp;|&nbsp; ESC · Pause</div>
        </div>
    </div>

    <div id="hud" style="display:none;">
        <div id="hud-title">&#10052; FROZEN FRONTIER</div>
        <div id="hud-controls">WASD · Move &nbsp;|&nbsp; Mouse · Look &nbsp;|&nbsp; Space · Jump</div>
    </div>

    <div id="crosshair" style="display:none;">+</div>

    <!-- Anomaly discovery counter (top-right, shown when locked) -->
    <div id="anomaly-counter" style="display:none;">
        <span class="cnt-num">0</span><span class="cnt-sep"> / 5</span><span class="cnt-label"> ANOMALIES</span>
    </div>

    <!-- Brief flash message on discovery -->
    <div id="discovery-msg"></div>

    <!-- Frost vignette — always visible, purely CSS -->
    <div id="frost"></div>

    <div id="lore-panel"></div>
</body>
</html>
